# 可选：用独立 MySQL 容器（端口 3307，避免与本机 3306 冲突）。
#   docker compose --env-file server/.env up -d
#   然后用 CHEMERA_DB_PORT=3307 启动后端。
# 口令全部来自 server/.env（已 gitignore），本文件不落字面量。
services:
  mysql:
    image: mysql:9.5
    container_name: chemera-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in server/.env}
      MYSQL_DATABASE: chemera
      MYSQL_USER: ${CHEMERA_DB_USER:-chem}
      MYSQL_PASSWORD: ${CHEMERA_DB_PASSWORD:?set CHEMERA_DB_PASSWORD in server/.env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - chemera-db:/var/lib/mysql

volumes:
  chemera-db:
