spring:
  datasource:
    url: jdbc:mysql://${CHEMERA_DB_HOST:localhost}:${CHEMERA_DB_PORT:3306}/${CHEMERA_DB_NAME:chemera}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: ${CHEMERA_DB_USER:chem}
    password: ${CHEMERA_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: chemera-pool
      maximum-pool-size: 16
      minimum-idle: 2
      connection-timeout: 10000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8
